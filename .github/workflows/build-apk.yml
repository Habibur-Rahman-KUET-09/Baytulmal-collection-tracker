name: Build APK

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/android-app-data-import-export-ia9rf1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Version from pubspec (1.0.0+N -> 1.0.0.N)
        id: version
        run: |
          v=$(grep -E '^version: ' pubspec.yaml | sed -E 's/^version: ([0-9.]+)\+([0-9]+)$/\1.\2/')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building Baytulmal $v"

      - run: flutter build apk --release

      - name: Name the APK after the app and version
        run: |
          cd build/app/outputs/flutter-apk
          mv app-release.apk "Baytulmal-${{ steps.version.outputs.version }}.apk"
          ls -lh Baytulmal-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Baytulmal-${{ steps.version.outputs.version }}
          path: build/app/outputs/flutter-apk/Baytulmal-*.apk
          retention-days: 30
