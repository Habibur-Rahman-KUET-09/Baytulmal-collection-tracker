name: Build APK

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/android-app-data-import-export-ia9rf1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: baytulmal-collection-tracker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
