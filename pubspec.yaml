name: baytulmal_collection_tracker
description: "বাইতুলমাল কালেকশন ট্র্যাকার — অফলাইন-ফার্স্ট মাসিক কালেকশন হিসাব রাখার অ্যাপ।"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Persists the bn/en language choice (a per-device UI preference, not
  # data — deliberately not synced/backed up like everything else).
  shared_preferences: ^2.3.2

  # Local database
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3

  # Charts (Trend / Compare screen)
  fl_chart: ^1.2.0

  # PDF export (Matrix report)
  pdf: ^3.11.0
  printing: ^5.13.1

  # Excel export (Matrix report)
  excel: ^4.0.6

  # Share exported files / backup files
  share_plus: ^13.0.0

  # Pick a JSON backup file to import
  file_picker: ^12.0.0

  # Stable IDs for future cloud-sync readiness (FR-7.3)
  uuid: ^4.4.2

  # Firebase: Auth (email/password + Google) and Firestore as the primary
  # data store, replacing local-only sqflite (kept for reading old backups
  # during migration — see BackupService).
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3
  image: ^4.3.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false # this project has no ios/ platform directory
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#081A15"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/NotoSansBengali-Regular.ttf
    - assets/fonts/NotoSansBengali-Bold.ttf

  fonts:
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
        - asset: assets/fonts/NotoSansBengali-Bold.ttf
          weight: 700
